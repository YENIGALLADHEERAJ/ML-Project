<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OrthoTrace logo">
  <defs>
    <linearGradient id="otBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14594c"/>
      <stop offset=".55" stop-color="#0a3029"/>
      <stop offset="1" stop-color="#04120f"/>
    </linearGradient>
    <radialGradient id="otGlow" cx=".8" cy=".16" r=".75">
      <stop offset="0" stop-color="#d8ff5c" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#62d9ad" stop-opacity=".12"/>
      <stop offset="1" stop-color="#62d9ad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="otBone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a6efcf"/>
    </linearGradient>
    <linearGradient id="otTrace" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#43d6a6"/>
      <stop offset="1" stop-color="#e2ff6b"/>
    </linearGradient>
    <radialGradient id="otDot">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#e2ff6b"/>
      <stop offset="1" stop-color="#e2ff6b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="1" y="1" width="62" height="62" rx="18" fill="url(#otBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="18" fill="url(#otGlow)"/>
  <rect x="1.6" y="1.6" width="60.8" height="60.8" rx="17.4" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1.2"/>

  <!-- scan corners -->
  <path d="M11 17v-4a2 2 0 0 1 2-2h4M47 11h4a2 2 0 0 1 2 2v4M53 47v4a2 2 0 0 1-2 2h-4M17 53h-4a2 2 0 0 1-2-2v-4"
        fill="none" stroke="#62d9ad" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/>

  <!-- tracer ring (behind the bones) -->
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="url(#otTrace)" stroke-width="2.4" stroke-linecap="round"
          stroke-dasharray="58 14 24 14" transform="rotate(-62 32 32)"/>
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="#62d9ad" stroke-opacity=".28" stroke-width="1" stroke-dasharray="2 5" stroke-linecap="round"/>

  <!-- joint: two bones meeting at the articulation -->
  <g transform="rotate(-42 32 32)" fill="url(#otBone)">
    <rect x="13" y="28.9" width="16.5" height="6.2" rx="3.1"/>
    <circle cx="14.4" cy="28.1" r="4.1"/>
    <circle cx="14.4" cy="35.9" r="4.1"/>
    <rect x="34.5" y="28.9" width="16.5" height="6.2" rx="3.1"/>
    <circle cx="49.6" cy="28.1" r="4.1"/>
    <circle cx="49.6" cy="35.9" r="4.1"/>
  </g>

  <!-- tracer head at the end of the scan arc -->
  <circle cx="26.9" cy="15.3" r="6.4" fill="url(#otDot)" opacity=".9"/>
  <circle cx="26.9" cy="15.3" r="2.2" fill="#ffffff"/>
</svg>
