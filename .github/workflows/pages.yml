name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["ML3/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir _site
          cp -r ML3/site/. _site/
          # backend, checkpoints, QA and build tooling are not part of the static site
          rm -rf _site/api _site/qa _site/__pycache__ _site/.claude _site/Dockerfile _site/.dockerignore
          rm -f _site/*.py _site/*.template
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
